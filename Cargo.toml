[package]
name = "rustsf"
version = "0.0.2"
authors = ["Wim Velzeboer <wim@velzeboer.nl>"]
license = "MIT"
description = "Rust Salesforce API Client"
documentation = "https://docs.rs/rustsf"
homepage = "https://github.com/wimvelzeboer/rustsf"
repository = "https://github.com/wimvelzeboer/rustsf"
readme = "README.md"
keywords = ["Salesforce", "API"]
categories = ["web-programming"]
edition = "2024"
rust-version = "1.93.0"

[features]
rest-api = []

[dependencies]

reqwest = { version = "0.13.4", features = ["form", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
roxmltree = "0.21.1"
log = "0.4.33"
regex = "1.13.1"

[dev-dependencies]

#cargo-license = "0.6.1"
mockito = "1.7.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
#env_logger = "0.11.3"
#anyhow = "1.0.32"
html-escape = "0.2.15"
