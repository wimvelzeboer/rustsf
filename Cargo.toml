[package]
name = "rustsf"
version = "0.0.2"
authors = ["Wim Velzeboer <wim@velzeboer.nl>"]
license = "MIT"
description = "Salesforce SDK for Rust, supports the latest API version 67.0, (Summer 2026)"
documentation = "https://docs.rs/rustsf"
homepage = "https://github.com/wimvelzeboer/rustsf"
repository = "https://github.com/wimvelzeboer/rustsf"
readme = "README.md"
keywords = ["Salesforce", "API", "sdk", "sfdx", "REST"]
categories = ["web-programming", "web-programming::http-client", "database", "development-tools::build-utils"]
edition = "2024"
rust-version = "1.93.0"

[features]
## Enable Salesforce REST API v67.0 (Summer 2026)
rest-api = []

[dependencies]
rustsf_marcos = "0.0.2"
reqwest = { version = "0.13.4", features = ["form", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
roxmltree = "0.21.1"
log = "0.4.33"
regex = "1.13.1"
compact_str = { version = "0.10.0", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }

[dev-dependencies]
#cargo-license = "0.6.1"
mockito = "1.7.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
#env_logger = "0.11.3"
anyhow = "1.0.32"
html-escape = "0.2.15"
